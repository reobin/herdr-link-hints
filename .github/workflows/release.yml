name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # gh release create
  actions: read # read the ci runs for this sha
  id-token: write # attestation signing
  attestations: write # attestation upload

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # A tag is the only trigger here, and tags run no checks of their own, so
      # the gate is ci's verdict on the commit the tag points at. A commit that
      # never got a run is a failure, not a pass.
      - name: require green ci for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 40); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100")"
            if [ "$(jq -r '.total_count' <<<"$runs")" -eq 0 ]; then
              echo "waiting for ci to start for $GITHUB_SHA"
              sleep 15
              continue
            fi
            pending="$(jq -r '[.workflow_runs[] | select(.status != "completed")] | length' <<<"$runs")"
            if [ "$pending" -gt 0 ]; then
              echo "waiting for $pending ci run(s) to finish"
              sleep 15
              continue
            fi
            bad="$(jq -r '[.workflow_runs[] | select(.conclusion != "success") | .conclusion] | join(",")' <<<"$runs")"
            if [ -n "$bad" ]; then
              echo "ci for $GITHUB_SHA concluded: $bad" >&2
              exit 1
            fi
            echo "ci is green for $GITHUB_SHA"
            exit 0
          done
          echo "timed out waiting for ci on $GITHUB_SHA" >&2
          exit 1

      # install.sh derives the download URL from the manifest version, so a
      # mismatch here would ship a release nobody can install.
      - name: check manifest version matches tag
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' herdr-plugin.toml | head -1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "manifest version $version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi

      # CGO_ENABLED=0 matters: linux/amd64 is a native build here, so cgo
      # would default on and the net package would link glibc dynamically,
      # breaking musl distros. Nothing here needs libc.
      - name: build
        env:
          CGO_ENABLED: 0
          # armv6 so the 32-bit build runs on Pi 1/Zero as well as armv7.
          GOARM: 6
        run: |
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 linux/arm; do
            os="${target%/*}"
            arch="${target#*/}"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "dist/picker-$os-$arch" .
          done
          cd dist && sha256sum picker-* > checksums.txt

      # checksums.txt catches a corrupted download; only this catches a
      # release that was never built from this repo.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/picker-*

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
