id = "herdr-link-hints"
name = "Link Hints"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "Vimium-style keyboard link hints: type a hint code to open a URL from the focused pane."
platforms = ["linux", "macos"]

[[build]]
command = ["bash", "install.sh"]

[[actions]]
id = "hints"
title = "Hint links in focused pane"
contexts = ["pane"]
command = ["bash", "hints-open.sh"]

# The picker pane takes no title and no border: Herdr draws the title on
# the border, so any title is chrome around a two-row readout.
[[panes]]
id = "picker"
placement = "popup"
command = ["./picker"]
