id = "herdr-link-hints"
name = "Link Hints"
version = "2.1.0"
min_herdr_version = "0.9.2"
description = "Keyboard link hints: get a popup listing the links on screen, pick a row to open one."
platforms = ["linux", "macos"]

[[build]]
command = ["bash", "install.sh"]

[[actions]]
id = "hints"
title = "hint links in focused pane"
contexts = ["pane"]
command = ["./picker", "--open"]

# A title is required, and Herdr draws it on the pane border.
[[panes]]
id = "picker"
title = "hint links"
placement = "popup"
command = ["./picker"]
