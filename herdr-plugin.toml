id = "herdr-link-hints"
name = "Link Hints"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "Vimium-style keyboard link hints: type a hint code to open a URL from the focused pane."
platforms = ["linux", "macos"]

[[build]]
command = ["bash", "install.sh"]

[[actions]]
id = "hints"
title = "Hint links in focused pane"
contexts = ["pane"]
command = ["bash", "hints-open.sh"]

# The pane's shape is decided in `picker --open`. HINTS_WIDTH and
# HINTS_HEIGHT override it.
[[panes]]
id = "picker"
title = "Link hints"
placement = "popup"
command = ["./picker"]
