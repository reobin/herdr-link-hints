id = "herdr-link-hints"
name = "Link Hints"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Vimium-style keyboard link hints: type a hint code to open a URL from the focused pane."
platforms = ["linux", "macos"]

[[build]]
command = ["bash", "install.sh"]

[[actions]]
id = "hints"
title = "Hint links in focused pane"
contexts = ["pane"]
command = ["bash", "hints-open.sh"]

# The popup's shape lives here. hints-open.sh only overrides it when
# HINTS_WIDTH or HINTS_HEIGHT is set.
[[panes]]
id = "picker"
title = "Link hints"
placement = "popup"
width = "80%"
height = "60%"
command = ["./picker"]
