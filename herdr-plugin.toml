id = "herdr-link-hints"
name = "Link Hints"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "Vimium-style keyboard link hints: type a hint code to open a URL from the focused pane."
platforms = ["linux", "macos"]

[[build]]
command = ["bash", "install.sh"]

[[actions]]
id = "hints"
title = "Hint links in focused pane"
contexts = ["pane"]
command = ["./picker", "--open"]

# A title is required, and Herdr draws it on the pane border.
[[panes]]
id = "picker"
title = "Link Hints"
placement = "popup"
command = ["./picker"]
